openapi: 3.0.3
info:
  title: Modular Backend API
  version: 1.0.0
  description: API de usuarios y autenticación. ADMIN, OWNER y RRHH reciben access token de 5 minutos y refresh token de 7 días. WORKER recibe access token de 45 segundos sin refresh token.
servers:
  - url: https://restaurant-no-there-production.up.railway.app/api/v1
    description: Producción

  - url: http://localhost:8080/api/v1
    description: Local
tags:
  - name: Auth
  - name: Users
  - name: Workforce
  - name: Meals
  - name: Testing
paths:
  /food-days:
    post:
      tags: [Foods]
      summary: Schedule a food for a date and meal type
      description: ADMIN, OWNER or COLLABORATOR. Requires at least 3 calendar days of advance notice in America/Lima. Creates OPEN; repeated assignments are allowed. The scheduler closes OPEN records whose service_date is today plus 3 days or earlier, at startup and every minute. A record created exactly 3 days ahead closes on the next scheduler run.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service_date, meal_type, food_id]
              properties:
                service_date: {type: string, format: date}
                meal_type: {type: string, enum: [BREAKFAST, LUNCH, DINNER]}
                food_id: {type: string, format: uuid}
      responses:
        '201':
          description: Created as OPEN
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FoodDay'}
        '400': {description: Invalid input, insufficient advance notice or nonexistent food}
        '401': {description: Authentication required}
        '403': {description: Role not allowed}
        '500': {description: Internal error}
    get:
      tags: [Foods]
      summary: List food days grouped by date and meal type
      description: All statuses included. Dates ascending, meal groups ordered BREAKFAST, LUNCH, DINNER. Calories use current food values and count every assignment, including repeated foods. Without date returns all dates with assignments; no results returns an empty array.
      security: [{bearerAuth: []}]
      parameters:
        - in: query
          name: date
          schema: {type: string, format: date}
      responses:
        '200':
          description: Daily groups with daily and per-meal calorie totals
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    service_date: {type: string, format: date}
                    total_calories: {type: number, format: double}
                    meals:
                      type: array
                      items:
                        type: object
                        properties:
                          meal_type: {type: string, enum: [BREAKFAST, LUNCH, DINNER]}
                          total_calories: {type: number, format: double}
                          foods:
                            type: array
                            items:
                              allOf:
                                - {$ref: '#/components/schemas/FoodDay'}
                                - type: object
                                  properties:
                                    food: {$ref: '#/components/schemas/Food'}
        '400': {description: Invalid date}
        '401': {description: Authentication required}
        '500': {description: Internal error}
  /food-days/{id}:
    delete:
      tags: [Foods]
      summary: Delete an OPEN food day
      description: ADMIN, OWNER or COLLABORATOR. CLOSED records cannot be deleted.
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      responses:
        '204': {description: Deleted}
        '400': {description: Invalid UUID}
        '401': {description: Authentication required}
        '403': {description: Role not allowed}
        '404': {description: Food day not found}
        '409': {description: Only OPEN food days can be deleted}
        '500': {description: Internal error}
  /foods/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [Foods]
      summary: Get a food by ID including its assigned tags
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Food
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Food'}
        '400': {description: Invalid food UUID}
        '401': {description: Authentication required}
        '404': {description: Food not found}
        '500': {description: Internal error}
    put:
      tags: [Foods]
      summary: Update a food and replace its assigned tags
      description: ADMIN, OWNER or COLLABORATOR. Provided fields are updated; omitted or null fields are preserved. tag_ids replaces the complete tag list; send an empty array to remove all tags. Duplicate IDs are assigned once. All tag IDs must exist; any failure rolls back the entire update.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string, minLength: 1, maxLength: 200}
                long_description: {type: string, minLength: 1}
                total_calories: {type: number, format: double, minimum: 0}
                photo_url: {type: string, minLength: 1}
                tag_ids:
                  type: array
                  items: {type: string, format: uuid}
      responses:
        '200':
          description: Updated food including its assigned tags
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Food'}
        '400': {description: Invalid input or nonexistent tag IDs}
        '401': {description: Authentication required}
        '403': {description: Role not allowed}
        '404': {description: Food not found}
        '500': {description: Internal error}
  /foods:
    post:
      tags: [Foods]
      summary: Create a food and assign existing tags
      description: ADMIN, OWNER or COLLABORATOR. All tag IDs must exist; creation is atomic. Repeated tag IDs are assigned once.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, long_description, total_calories, photo_url]
              properties:
                name: {type: string, minLength: 1, maxLength: 200}
                long_description: {type: string, minLength: 1}
                total_calories: {type: number, format: double, minimum: 0, example: 450.5}
                photo_url: {type: string, minLength: 1}
                tag_ids:
                  type: array
                  default: []
                  items: {type: string, format: uuid}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Food'}
        '400': {description: Invalid input or nonexistent tag IDs}
        '401': {description: Authentication required}
        '403': {description: Role not allowed}
        '500': {description: Internal error}
    get:
      tags: [Foods]
      summary: List foods with pagination and optional tag filters
      description: Any authenticated user. Without tag_ids returns all foods paginated. With tag_ids matches ANY selected tag and returns all tags assigned to each food. Ordered by creation date descending.
      security: [{bearerAuth: []}]
      parameters:
        - in: query
          name: page
          schema: {type: integer, minimum: 1, default: 1}
        - in: query
          name: page_size
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - in: query
          name: tag_ids
          description: Comma-separated UUIDs. Repeated query parameters are also accepted.
          style: form
          explode: false
          schema:
            type: array
            items: {type: string, format: uuid}
      responses:
        '200':
          description: Paginated foods
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Food'}
                  page: {type: integer}
                  page_size: {type: integer}
                  total: {type: integer, format: int64}
                  total_pages: {type: integer, format: int64}
        '400': {description: Invalid pagination or tag UUIDs}
        '401': {description: Authentication required}
        '500': {description: Internal error}
  /tags:
    post:
      tags: [Foods]
      summary: Create a reusable tag
      description: ADMIN, OWNER or COLLABORATOR. Names are trimmed and unique ignoring case.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 100, example: Vegan}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FoodTag'}
        '400': {description: Invalid name}
        '401': {description: Authentication required}
        '403': {description: Role not allowed}
        '409': {description: Tag name already exists}
        '500': {description: Internal error}
    get:
      tags: [Foods]
      summary: List all tags sorted by name
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Tags, or an empty array
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/FoodTag'}
        '401': {description: Authentication required}
        '500': {description: Internal error}
  /test/server-time:
    put:
      tags: [Testing]
      summary: Establecer la fecha y hora de prueba
      description: Endpoint público y temporal para pruebas. No requiere autenticación. Ajusta el reloj usado por las reglas de turnos y comidas; el tiempo continúa avanzando desde el valor indicado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [datetime]
              properties:
                datetime: {type: string, format: date-time, example: '2026-09-04T12:30:00-05:00'}
      responses:
        '200':
          description: Reloj ajustado
          content:
            application/json:
              example: {datetime: '2026-09-04T12:30:00-05:00', date: '2026-09-04', time: '12:30:00', timezone: America/Lima, adjusted: true}
        '400': {$ref: '#/components/responses/BadRequest'}
    get:
      tags: [Testing]
      summary: Consultar la fecha y hora efectiva del servidor
      description: RRHH, OWNER, COLLABORATOR y WORKER. Devuelve la hora usada por los servicios de Workforce y Meals.
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Fecha y hora efectiva en America/Lima
          content:
            application/json:
              example: {datetime: '2026-09-02T06:30:00-05:00', date: '2026-09-02', time: '06:30:00', timezone: America/Lima, adjusted: true}
  /auth/bootstrap/admin:
    post:
      tags: [Auth]
      summary: Crear temporalmente el primer ADMIN
      description: Endpoint temporal. Solo funciona si todavía no existe ningún ADMIN.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminBootstrapRequest'}
      responses:
        '201': {description: ADMIN creado, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {description: Ya existe un ADMIN}
  /users/register/management:
    post:
      tags: [Users]
      summary: Registrar OWNER o RRHH
      description: Requiere Bearer token de ADMIN.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ManagementRegisterRequest'}
            examples:
              owner:
                value: {username: owner1, password: password123, email: owner@example.com, first_name: Ana, last_name: López, role: OWNER}
      responses:
        '201': {description: Creado, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /users/register/worker:
    post:
      tags: [Users]
      summary: Registrar WORKER
      description: Requiere Bearer token de ADMIN o RRHH. Crea atómicamente el usuario WORKER y su información laboral; los IDs se generan automáticamente.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkerRegisterRequest'}
            example: {dni: '10203040', email: worker@example.com, photo_url: 'https://cdn.example.com/workers/juan.jpg', first_name: Juan, last_name: Pérez, employee_code: EMP-001, job_title: Operario, department: Producción, hire_date: '2026-09-01'}
      responses:
        '201': {description: Usuario y ficha laboral creados, content: {application/json: {schema: {$ref: '#/components/schemas/WorkerRegistrationResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /users/register/collaborator:
    post:
      tags: [Users]
      summary: Registrar un COLLABORATOR
      description: ADMIN u OWNER. Crea un ayudante que puede recibir y validar pedidos de comida.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CollaboratorRegisterRequest'}
      responses:
        '201': {description: Colaborador creado, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /users/collaborators:
    get:
      tags: [Users]
      summary: Listar colaboradores
      description: Solo OWNER.
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Colaboradores, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/MyUser'}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /auth/login/password:
    post:
      tags: [Auth]
      summary: Login de ADMIN, OWNER, RRHH o COLLABORATOR
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PasswordLogin'}}}}
      responses:
        '200': {description: Tokens, content: {application/json: {schema: {$ref: '#/components/schemas/TokenPair'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/login/dni:
    post:
      tags: [Auth]
      summary: Login temporal de WORKER por DNI y contraseña
      description: Valida el DNI y la contraseña del trabajador. Emite un access token de 45 segundos y no genera refresh token.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DNILogin'}}}}
      responses:
        '200': {description: Access token temporal sin refresh token, content: {application/json: {schema: {$ref: '#/components/schemas/WorkerAccessToken'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotar refresh token administrativo
      description: Disponible solamente para ADMIN, OWNER y RRHH. Los WORKER no poseen refresh token.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RefreshRequest'}}}}
      responses:
        '200': {description: Tokens nuevos, content: {application/json: {schema: {$ref: '#/components/schemas/TokenPair'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /users/my:
    get:
      tags: [Users]
      summary: Obtener mi usuario
      description: Obtiene la identidad, rol, perfil y datos laborales del usuario identificado por el Bearer token.
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Usuario autenticado, content: {application/json: {schema: {$ref: '#/components/schemas/MyUser'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Usuario no encontrado}
  /users:
    get:
      tags: [Users]
      summary: Listar todos los usuarios
      description: Solo ADMIN. Devuelve los usuarios con su user_id para permitir su selección y administración desde el frontend.
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/UserListItem'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /users/my/password:
    patch:
      tags: [Users]
      summary: Cambiar mi contraseña
      description: Obtiene el usuario desde el Bearer token y verifica la contraseña actual antes de guardar la nueva. También está disponible para WORKER.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangePasswordRequest'}
            example: {old_password: password123, new_password: nuevaPassword456}
      responses:
        '204': {description: Contraseña actualizada}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {description: Token inválido o contraseña anterior incorrecta, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /users/{id}/password/reset:
    put:
      tags: [Users]
      summary: Restablecer la contraseña de un usuario
      description: Solo ADMIN. Restablece la contraseña de cualquier usuario, incluido WORKER, sin solicitar su contraseña anterior.
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResetPasswordRequest'}
            example: {new_password: nuevaPassword456}
      responses:
        '204': {description: Contraseña restablecida}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Usuario o credencial de contraseña no encontrados}
  /users/workers:
    get:
      tags: [Users]
      summary: Listar trabajadores
      description: Disponible solamente para RRHH.
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Trabajadores, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/MyUser'}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /worker-shift-assignments:
    post:
      tags: [Workforce]
      summary: Agendar un trabajador en un turno
      description: Solo RRHH. Máximo un turno por trabajador y fecha. Puede asignarse hasta las 18:00 del día anterior al turno, según America/Lima.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AssignmentRequest'}
      responses:
        '201': {description: Asignación creada, content: {application/json: {schema: {$ref: '#/components/schemas/Assignment'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {description: El trabajador ya tiene un turno ese día, content: {application/json: {schema: {$ref: '#/components/schemas/AssignmentConflict'}}}}
  /worker-shift-assignments/add-massive:
    post:
      tags: [Workforce]
      summary: Asignar masivamente un turno a trabajadores
      description: Solo RRHH. El rango es inclusivo y debe comenzar como minimo manana segun America/Lima. Reemplaza cualquier asignacion OPEN existente para cada trabajador y fecha. La operacion es atomica.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MassiveAssignmentRequest'}
      responses:
        '201': {description: Turnos creados, content: {application/json: {schema: {$ref: '#/components/schemas/MassiveAssignmentResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: Existe una asignacion no reemplazable}
  /worker-shift-assignments/{id}:
    put:
      tags: [Workforce]
      summary: Modificar un turno asignado
      description: Solo RRHH. Puede modificarse hasta las 18:00 del día anterior al turno; después de esa hora queda bloqueado según America/Lima.
      security: [{bearerAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateAssignmentRequest'}
      responses:
        '200': {description: Asignación actualizada, content: {application/json: {schema: {$ref: '#/components/schemas/Assignment'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {description: Asignación no encontrada}
        '409': {description: El trabajador ya tiene otro turno en la nueva fecha}
        '423': {description: El turno ya está bloqueado por fecha}
    delete:
      tags: [Workforce]
      summary: Eliminar un turno asignado
      description: Solo RRHH. Puede eliminarse hasta las 18:00 del día anterior; después de esa hora queda bloqueado según America/Lima.
      security: [{bearerAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '204': {description: Asignación eliminada}
        '404': {description: Asignación no encontrada}
        '423': {description: El turno ya está bloqueado por fecha}
  /workers/{id}/shifts/range:
    get:
      tags: [Workforce]
      summary: Consultar turnos de un trabajador entre fechas
      description: Disponible solamente para RRHH. Incluye las fechas from y to.
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: from, in: query, required: true, example: '2026-09-01', schema: {type: string, format: date}}
        - {name: to, in: query, required: true, example: '2026-09-30', schema: {type: string, format: date}}
      responses:
        '200': {description: Turnos en el rango, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Assignment'}}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /workers/my/shifts/range:
    get:
      tags: [Workforce]
      summary: Consultar mis turnos entre fechas
      description: Solo WORKER. El trabajador se obtiene del Bearer Token; incluye las fechas from y to.
      security: [{bearerAuth: []}]
      parameters:
        - {name: from, in: query, required: true, example: '2026-09-01', schema: {type: string, format: date}}
        - {name: to, in: query, required: true, example: '2026-09-30', schema: {type: string, format: date}}
      responses:
        '200': {description: Turnos del trabajador autenticado en el rango, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Assignment'}}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /workers/my/status:
    get:
      tags: [Workforce, Meals]
      summary: Consultar mi turno y alimentación actual
      description: Solo WORKER. Obtiene el usuario desde el token y evalúa turno, horario de comida, elegibilidad, reclamo y consumo usando hora de Perú. El turno DAY permanece activo desde el inicio de BREAKFAST hasta el fin de LUNCH; el turno DINNER, desde el inicio de DINNER hasta el fin de BREAKFAST del día siguiente.
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Estado actual, content: {application/json: {schema: {$ref: '#/components/schemas/WorkerCurrentStatus'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /meal-schedules:
    get:
      tags: [Meals]
      summary: Consultar los horarios de comidas
      description: Disponible para cualquier usuario autenticado. Devuelve los horarios activos usando la zona horaria configurada.
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Horarios de comidas, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/MealSchedule'}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /meal-claims/my/preview:
    get:
      tags: [Meals]
      summary: Obtener la comida que puede reclamar el trabajador
      description: Solo WORKER. Usa el usuario del token y no crea registros. Informa turno, comida, horario, disponibilidad y si ya fue reclamada.
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Vista previa del reclamo, content: {application/json: {schema: {$ref: '#/components/schemas/MealClaimPreview'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /meal-claims/my/confirm-print:
    post:
      tags: [Meals]
      summary: Confirmar impresión y registrar el reclamo
      description: Solo WORKER. Crea meal_claims únicamente cuando printed es true. Vuelve a validar horario, turno elegible y que la comida no haya sido reclamada.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MealPrintConfirmation'}
      responses:
        '201': {description: Impresión confirmada y reclamo registrado, content: {application/json: {schema: {$ref: '#/components/schemas/MealPrintConfirmationResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: La comida ya fue reclamada}
  /collaborator/meal-orders:
    get:
      tags: [Meals]
      summary: Listar pedidos de comida
      description: Solo COLLABORATOR. Por defecto devuelve CLAIMED; la lista deja de incluir un pedido al validarse o al cerrar su horario.
      security: [{bearerAuth: []}]
      parameters:
        - {name: status, in: query, required: false, schema: {type: string, enum: [CLAIMED, VALIDATED], default: CLAIMED}}
      responses:
        '200': {description: Pedidos, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/MealOrder'}}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /meal-status-reports:
    get:
      tags: [Meals]
      summary: Reporte paginado de estados de comidas por rango
      description: Solo OWNER. Agrupa por tipo de comida los estados reclamados (CLAIMED, CLAIMED_BUT_NOT_VALIDATED y VALIDATED) y no reclamados (CREATED y NOT_CLAIMED), e incluye el detalle por trabajador.
      security: [{bearerAuth: []}]
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date}}
        - {name: to, in: query, required: true, schema: {type: string, format: date}}
        - {name: page, in: query, required: false, schema: {type: integer, minimum: 1, default: 1}}
        - {name: page_size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200': {description: Resumen por comida y detalle paginado con estados exactos}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /collaborator/meal-status-reports/daily:
    get:
      tags: [Meals]
      summary: Consultar comidas y estados de un día
      description: Solo COLLABORATOR. Devuelve la lista paginada de trabajadores asignados y el estado de una sola comida para la fecha indicada.
      security: [{bearerAuth: []}]
      parameters:
        - {name: date, in: query, required: true, schema: {type: string, format: date}, example: '2026-09-02'}
        - {name: meal_type, in: query, required: true, schema: {type: string, enum: [BREAKFAST, LUNCH, DINNER]}}
        - {name: page, in: query, required: false, schema: {type: integer, minimum: 1, default: 1}}
        - {name: page_size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200': {description: Personas asignadas y sus estados, paginadas, content: {application/json: {schema: {$ref: '#/components/schemas/DailyMealStatusReport'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /meal-status-reports/export.xlsx:
    get:
      tags: [Meals]
      summary: Exportar estados de comidas por rango
      security: [{bearerAuth: []}]
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date}}
        - {name: to, in: query, required: true, schema: {type: string, format: date}}
      responses:
        '200': {description: Archivo Excel con hojas Resumen y Detalle}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /collaborator/meal-orders/{id}:
    get:
      tags: [Meals]
      summary: Buscar un pedido por UUID
      description: Solo COLLABORATOR. Si ya se entregó devuelve status VALIDATED y la hora de validación.
      security: [{bearerAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Pedido, content: {application/json: {schema: {$ref: '#/components/schemas/MealOrder'}}}}
        '404': {description: Pedido inexistente}
  /collaborator/meal-orders/{id}/validate:
    put:
      tags: [Meals]
      summary: Entregar y validar un pedido
      description: Solo COLLABORATOR. La transición CLAIMED a VALIDATED es atómica. Puede validarse desde el inicio de la comida hasta 30 minutos después del fin de su ventana de reclamo.
      security: [{bearerAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Pedido validado, content: {application/json: {schema: {$ref: '#/components/schemas/MealOrder'}}}}
        '404': {description: Pedido inexistente}
        '409': {description: El pedido ya fue validado por otro colaborador}
  /workforce/shift-preview:
    get:
      tags: [Workforce]
      summary: Ruta compatible para la lista de comidas que se preparan por fecha
      security: [{bearerAuth: []}]
      parameters:
        - {name: from, in: query, required: true, description: Inicio inclusivo desde mañana., schema: {type: string, format: date}}
        - {name: to, in: query, required: true, description: Fin inclusivo del rango., schema: {type: string, format: date}}

      responses:
        '200':
          description: Comidas programadas agrupadas por fecha
  /workforce/shift-preview/export.xlsx:
    get:
      tags: [Workforce]
      summary: Exportar Comidas Dia Actual a Excel
      description: Genera una hoja por cada día del rango con el resumen y los trabajadores asignados.
      security: [{bearerAuth: []}]
      parameters:
        - {name: from, in: query, required: true, description: Inicio inclusivo desde mañana., schema: {type: string, format: date}}
        - {name: to, in: query, required: true, description: Fin inclusivo del rango., schema: {type: string, format: date}}

        - {name: meal_type, in: query, required: false, schema: {type: array, items: {type: string, enum: [BREAKFAST, LUNCH, DINNER]}}}

      responses:
        '200':
          description: Archivo XLSX
  /collaborator/ws/meal-orders:
    get:
      tags: [Meals]
      summary: WebSocket de pedidos en vivo
      description: Solo COLLABORATOR. En navegador conectar con los subprotocolos ["bearer", "JWT"]. El token no se acepta en la URL. Emite CLAIMED_ORDERS con todos los pedidos CLAIMED al conectarse y cada vez que la lista cambia; también emite MEAL_ORDER_CREATED y MEAL_ORDER_VALIDATED con el pedido afectado.
      responses:
        '101': {description: WebSocket conectado}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  responses:
    BadRequest: {description: Datos inválidos, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Unauthorized: {description: Credenciales inválidas, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Forbidden: {description: El rol autenticado no tiene permiso, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  schemas:
    FoodDay:
      type: object
      properties:
        id: {type: string, format: uuid}
        service_date: {type: string, format: date}
        meal_type: {type: string, enum: [BREAKFAST, LUNCH, DINNER]}
        food_id: {type: string, format: uuid}
        status: {type: string, enum: [OPEN, CLOSED]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    FoodTag:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Food:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        long_description: {type: string}
        total_calories: {type: number, format: double, minimum: 0}
        photo_url: {type: string}
        tags:
          type: array
          items: {$ref: '#/components/schemas/FoodTag'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    UserListItem:
      type: object
      properties:
        user_id: {type: string, format: uuid}
        role: {type: string, enum: [ADMIN, OWNER, RRHH, WORKER, COLLABORATOR]}
        active: {type: boolean}
        first_name: {type: string}
        last_name: {type: string}
        email: {type: string, format: email}
    ChangePasswordRequest:
      type: object
      required: [old_password, new_password]
      properties:
        old_password: {type: string, format: password}
        new_password: {type: string, format: password, minLength: 8}
    ResetPasswordRequest:
      type: object
      required: [new_password]
      properties:
        new_password: {type: string, format: password, minLength: 8}
    AdminBootstrapRequest:
      type: object
      required: [username, password, first_name, last_name]
      properties:
        username: {type: string}
        email: {type: string, format: email}
        password: {type: string, minLength: 8}
        first_name: {type: string}
        last_name: {type: string}
    ManagementRegisterRequest:
      type: object
      required: [username, password, first_name, last_name, role]
      properties:
        username: {type: string}
        email: {type: string, format: email}
        password: {type: string, minLength: 8}
        first_name: {type: string}
        last_name: {type: string}
        role: {type: string, enum: [OWNER, RRHH]}
    CollaboratorRegisterRequest:
      type: object
      required: [username, password, first_name, last_name]
      properties:
        username: {type: string, example: ayudante1}
        password: {type: string, minLength: 8}
        email: {type: string, format: email}
        first_name: {type: string}
        last_name: {type: string}
    WorkerRegisterRequest:
      type: object
      description: La contraseña inicial del trabajador será el mismo número de DNI.
      required: [dni, first_name, last_name, employee_code]
      properties:
        dni: {type: string}
        email: {type: string, format: email}
        photo_url: {type: string, format: uri, description: URL opcional de la foto del trabajador}
        first_name: {type: string}
        last_name: {type: string}
        employee_code: {type: string, example: EMP-001}
        job_title: {type: string, example: Operario}
        department: {type: string, example: Producción}
        phone: {type: string}
        address: {type: string}
        hire_date: {type: string, format: date}
        emergency_contact_name: {type: string}
        emergency_contact_phone: {type: string}
        notes: {type: string}
    WorkerRegistrationResponse:
      type: object
      properties:
        user: {$ref: '#/components/schemas/User'}
        worker_information:
          type: object
          properties:
            user_id: {type: string, format: uuid}
            employee_code: {type: string}
            photo_url: {type: string, format: uri}
            job_title: {type: string}
            department: {type: string}
    AssignmentRequest:
      type: object
      required: [worker_id, shift_type, work_date]
      properties:
        worker_id: {type: string, format: uuid}
        shift_type: {type: string, enum: [DAY, NIGHT]}
        work_date: {type: string, format: date}
        notes: {type: string}
    UpdateAssignmentRequest:
      type: object
      required: [shift_type, work_date]
      properties:
        shift_type: {type: string, enum: [DAY, NIGHT]}
        work_date: {type: string, format: date}
        notes: {type: string}
    MassiveAssignmentRequest:
      type: object
      required: [dates, shift, workers]
      properties:
        dates:
          type: object
          required: [from, to]
          properties:
            from: {type: string, format: date, example: '2026-09-14'}
            to: {type: string, format: date, example: '2026-09-20'}
        shift: {type: string, enum: [DAY, NIGHT]}
        workers:
          type: array
          minItems: 1
          items: {type: string, format: uuid}
    MassiveAssignmentResponse:
      type: object
      required: [created, replaced]
      properties:
        created: {type: integer, example: 105}
        replaced: {type: integer, example: 12}
    WorkerCurrentStatus:
      type: object
      properties:
        peru_time: {type: string, format: date-time}
        on_shift: {type: boolean}
        current_shift:
          type: object
          properties:
            assignment_id: {type: string, format: uuid}
            shift_type: {type: string, enum: [DAY, NIGHT]}
            work_date: {type: string, format: date}
        assigned_meals:
          type: array
          description: Comidas correspondientes al turno actual con su fecha efectiva de servicio.
          items:
            type: object
            properties:
              meal_type: {type: string, enum: [BREAKFAST, LUNCH, DINNER]}
              display_name: {type: string, enum: [Desayuno, Almuerzo, Cena]}
              service_date: {type: string, format: date}
        meal_window_open: {type: boolean}
        current_meal:
          type: object
          properties:
            meal_type: {type: string, enum: [BREAKFAST, LUNCH, DINNER]}
            window_start: {type: string}
            window_end: {type: string}
            eligible: {type: boolean}
            can_claim: {type: boolean}
            already_claimed: {type: boolean}
            claim_id: {type: string, format: uuid}
    Assignment:
      allOf:
        - {$ref: '#/components/schemas/AssignmentRequest'}
        - type: object
          properties:
            id: {type: string, format: uuid}
            assigned_by: {type: string, format: uuid}
            status: {type: string, enum: [OPEN, CLOSED]}
    AssignmentConflict:
      type: object
      properties:
        error:
          type: object
          properties:
            code: {type: string, example: WORKER_ALREADY_ASSIGNED}
            message: {type: string, example: El trabajador ya tiene un turno asignado para esa fecha}
            worker_id: {type: string, format: uuid}
            work_date: {type: string, format: date}
            existing_shift:
              type: object
              properties:
                assignment_id: {type: string, format: uuid}
                shift_type: {type: string, enum: [DAY, NIGHT]}
                notes: {type: string}
    MealClaimPreview:
      type: object
      properties:
        redemptionId: {type: string, format: uuid}
        ticketNumber: {type: string, example: TK-20260830-A1B2C3D4-LUNCH}
        status: {type: string, enum: [AUTHORIZED, DENIED]}
        worker:
          type: object
          properties:
            id: {type: string, format: uuid}
            fullName: {type: string, example: María Pérez Gómez}
            documentNumber: {type: string, example: '****5678'}
        service:
          type: object
          properties:
            type: {type: string, enum: [BREAKFAST, LUNCH, DINNER]}
            name: {type: string, enum: [BREAKFAST, ALMUERZO, CENA]}
        date: {type: string, example: '30/08/2026'}
        time: {type: string, example: '12:15 p.m.'}
        reason: {type: string}
    MealPrintConfirmation:
      type: object
      required: [meal_type, printed]
      properties:
        meal_type: {type: string, enum: [BREAKFAST, LUNCH, DINNER]}
        printed: {type: boolean, example: true}
        notes: {type: string, example: Ticket impreso correctamente}
    MealPrintConfirmationResponse:
      type: object
      properties:
        claim_created: {type: boolean, example: true}
        claim: {$ref: '#/components/schemas/MealClaim'}
    MealSchedule:
      type: object
      properties:
        meal_type: {type: string, enum: [BREAKFAST, LUNCH, DINNER]}
        claim_start: {type: string, example: '06:00:00'}
        claim_end: {type: string, example: '09:00:00'}
        timezone: {type: string, example: America/Lima}
        description: {type: string}
        active: {type: boolean}
    MealClaim:
      type: object
      properties:
        id: {type: string, format: uuid}
        worker_id: {type: string, format: uuid}
        shift_assignment_id: {type: string, format: uuid}
        meal_type: {type: string, enum: [BREAKFAST, LUNCH, DINNER]}
        service_date: {type: string, format: date}
        claimed_at: {type: string, format: date-time}
        status: {type: string, enum: [CREATED, CLAIMED, NOT_CLAIMED, CLAIMED_BUT_NOT_VALIDATED, VALIDATED]}
        validated_at: {type: string, format: date-time}
        validated_by: {type: string, format: uuid}
        notes: {type: string}
    MealOrder:
      allOf:
        - {$ref: '#/components/schemas/MealClaim'}
        - type: object
          properties:
            worker:
              type: object
              properties:
                id: {type: string, format: uuid}
                fullName: {type: string}
                documentNumber: {type: string, example: '****5678'}
                photoUrl: {type: string, format: uri, description: URL opcional de la foto del trabajador}
            service:
              type: object
              properties:
                type: {type: string, enum: [BREAKFAST, LUNCH, DINNER]}
                name: {type: string, enum: [BREAKFAST, ALMUERZO, CENA]}
    MealStatusSummary:
      type: object
      properties:
        meal_type: {type: string, enum: [BREAKFAST, LUNCH, DINNER]}
        total: {type: integer, format: int64}
        claimed: {type: integer, format: int64}
        not_claimed: {type: integer, format: int64}
        by_status:
          type: object
          additionalProperties: {type: integer, format: int64}
    DailyMealAssignment:
      type: object
      properties:
        id: {type: string, format: uuid}
        service_date: {type: string, format: date}
        meal_type: {type: string, enum: [BREAKFAST, LUNCH, DINNER]}
        shift_type: {type: string, enum: [DAY, NIGHT]}
        status: {type: string, enum: [CREATED, CLAIMED, NOT_CLAIMED, CLAIMED_BUT_NOT_VALIDATED, VALIDATED]}
        claimed_at: {type: string, format: date-time, nullable: true}
        validated_at: {type: string, format: date-time, nullable: true}
        worker_id: {type: string, format: uuid}
        full_name: {type: string}
        document_number: {type: string, example: '****5678'}
        employee_code: {type: string}
        department: {type: string, nullable: true}
        photo_url: {type: string, format: uri, nullable: true}
    DailyMealStatusReport:
      type: object
      properties:
        date: {type: string, format: date}
        meal_type: {type: string, enum: [BREAKFAST, LUNCH, DINNER]}
        data: {type: array, items: {$ref: '#/components/schemas/DailyMealAssignment'}}
        page: {type: integer}
        page_size: {type: integer}
        total: {type: integer, format: int64}
        total_pages: {type: integer}
    PasswordLogin:
      type: object
      required: [username, password]
      properties: {username: {type: string}, password: {type: string}}
    DNILogin:
      type: object
      required: [dni, password]
      properties: {dni: {type: string}, password: {type: string, format: password}}
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties: {refresh_token: {type: string}}
    TokenPair:
      type: object
      properties:
        access_token: {type: string}
        refresh_token: {type: string}
        token_type: {type: string, example: Bearer}
        expires_in: {type: integer, example: 300}
    WorkerAccessToken:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token: {type: string}
        token_type: {type: string, example: Bearer}
        expires_in: {type: integer, example: 45}
    User:
      type: object
      properties:
        id: {type: string, format: uuid}
        role: {type: string, enum: [ADMIN, OWNER, RRHH, WORKER, COLLABORATOR]}
        active: {type: boolean}
    MyUser:
      allOf:
        - {$ref: '#/components/schemas/User'}
        - type: object
          properties:
            profile:
              type: object
              properties:
                first_name: {type: string}
                last_name: {type: string}
                email: {type: string, format: email}
            credentials:
              type: array
              items:
                type: object
                properties:
                  type: {type: string, enum: [PASSWORD, DNI, FACE_SCAN]}
                  identifier: {type: string}
            worker_information:
              type: object
              properties:
                employee_code: {type: string}
                photo_url: {type: string, format: uri}
                job_title: {type: string}
                department: {type: string}
    Error:
      type: object
      properties: {error: {type: string}}
