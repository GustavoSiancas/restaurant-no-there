openapi: 3.0.3
info:
  title: Modular Backend API
  version: 1.0.0
  description: API de usuarios y autenticación. ADMIN, OWNER y RRHH reciben access token de 5 minutos y refresh token de 7 días. WORKER recibe access token de 45 segundos sin refresh token.
servers:
  - url: https://restaurant-no-there-production.up.railway.app/api/v1
    description: Producción

  - url: http://localhost:8080/api/v1
    description: Local
tags:
  - name: Auth
  - name: Users
  - name: Workforce
  - name: Meals
  - name: Testing
paths:
  /test/server-time:
    get:
      tags: [Testing]
      summary: Consultar la fecha y hora efectiva del servidor
      description: Endpoint público y temporal para pruebas. Devuelve la hora usada por los servicios de Workforce y Meals.
      responses:
        '200':
          description: Fecha y hora efectiva en America/Lima
          content:
            application/json:
              example: {datetime: '2026-09-02T06:30:00-05:00', date: '2026-09-02', time: '06:30:00', timezone: America/Lima, adjusted: true}
    put:
      tags: [Testing]
      summary: Modificar o restablecer la fecha y hora efectiva del servidor
      description: Endpoint público y temporal para pruebas. La hora fijada continúa avanzando normalmente. Enviar reset=true para volver a la hora real.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                datetime: {type: string, format: date-time, example: '2026-09-02T06:30:00-05:00'}
                reset: {type: boolean, default: false}
            examples:
              set: {value: {datetime: '2026-09-02T06:30:00-05:00'}}
              reset: {value: {reset: true}}
      responses:
        '200': {description: Fecha y hora efectiva actualizada}
        '400': {$ref: '#/components/responses/BadRequest'}
  /auth/bootstrap/admin:
    post:
      tags: [Auth]
      summary: Crear temporalmente el primer ADMIN
      description: Endpoint temporal. Solo funciona si todavía no existe ningún ADMIN.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminBootstrapRequest'}
      responses:
        '201': {description: ADMIN creado, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {description: Ya existe un ADMIN}
  /users/register/management:
    post:
      tags: [Users]
      summary: Registrar OWNER o RRHH
      description: Requiere Bearer token de ADMIN.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ManagementRegisterRequest'}
            examples:
              owner:
                value: {username: owner1, password: password123, email: owner@example.com, first_name: Ana, last_name: López, role: OWNER}
      responses:
        '201': {description: Creado, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /users/register/worker:
    post:
      tags: [Users]
      summary: Registrar WORKER
      description: Requiere Bearer token de ADMIN, OWNER o RRHH. Crea atómicamente el usuario WORKER y su información laboral; los IDs se generan automáticamente.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkerRegisterRequest'}
            example: {dni: '10203040', email: worker@example.com, first_name: Juan, last_name: Pérez, employee_code: EMP-001, job_title: Operario, department: Producción, hire_date: '2026-09-01'}
      responses:
        '201': {description: Usuario y ficha laboral creados, content: {application/json: {schema: {$ref: '#/components/schemas/WorkerRegistrationResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /users/register/collaborator:
    post:
      tags: [Users]
      summary: Registrar un COLLABORATOR
      description: Solo OWNER. Crea un ayudante que puede recibir y validar pedidos de comida.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CollaboratorRegisterRequest'}
      responses:
        '201': {description: Colaborador creado, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /users/collaborators:
    get:
      tags: [Users]
      summary: Listar colaboradores
      description: Solo OWNER.
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Colaboradores, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/MyUser'}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /auth/login/password:
    post:
      tags: [Auth]
      summary: Login de ADMIN, OWNER, RRHH o COLLABORATOR
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PasswordLogin'}}}}
      responses:
        '200': {description: Tokens, content: {application/json: {schema: {$ref: '#/components/schemas/TokenPair'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/login/dni:
    post:
      tags: [Auth]
      summary: Login temporal de WORKER por DNI
      description: Este mecanismo será reemplazable por Face Scan. Emite un access token de 45 segundos y no genera refresh token.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DNILogin'}}}}
      responses:
        '200': {description: Access token temporal sin refresh token, content: {application/json: {schema: {$ref: '#/components/schemas/WorkerAccessToken'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotar refresh token administrativo
      description: Disponible solamente para ADMIN, OWNER y RRHH. Los WORKER no poseen refresh token.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RefreshRequest'}}}}
      responses:
        '200': {description: Tokens nuevos, content: {application/json: {schema: {$ref: '#/components/schemas/TokenPair'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /users/my:
    get:
      tags: [Users]
      summary: Obtener mi usuario
      description: Obtiene la identidad, rol, perfil y datos laborales del usuario identificado por el Bearer token.
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Usuario autenticado, content: {application/json: {schema: {$ref: '#/components/schemas/MyUser'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Usuario no encontrado}
  /users/workers:
    get:
      tags: [Users]
      summary: Listar trabajadores
      description: Disponible para ADMIN, OWNER y RRHH.
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Trabajadores, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/MyUser'}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /users/management:
    get:
      tags: [Users]
      summary: Listar OWNER y RRHH
      description: Disponible únicamente para ADMIN.
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Usuarios OWNER y RRHH, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/MyUser'}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /worker-shift-assignments:
    post:
      tags: [Workforce]
      summary: Agendar un trabajador en un turno
      description: Solo RRHH. Máximo un turno por trabajador y fecha. Puede asignarse hasta las 23:59 del día anterior al turno, según America/Lima.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AssignmentRequest'}
      responses:
        '201': {description: Asignación creada, content: {application/json: {schema: {$ref: '#/components/schemas/Assignment'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {description: El trabajador ya tiene un turno ese día, content: {application/json: {schema: {$ref: '#/components/schemas/AssignmentConflict'}}}}
  /worker-shift-assignments/add-massive:
    post:
      tags: [Workforce]
      summary: Asignar masivamente un turno a trabajadores
      description: Solo RRHH. El rango es inclusivo y debe comenzar como minimo manana segun America/Lima. Reemplaza cualquier asignacion OPEN existente para cada trabajador y fecha. La operacion es atomica.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MassiveAssignmentRequest'}
      responses:
        '201': {description: Turnos creados, content: {application/json: {schema: {$ref: '#/components/schemas/MassiveAssignmentResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: Existe una asignacion no reemplazable}
  /worker-shift-assignments/{id}:
    put:
      tags: [Workforce]
      summary: Modificar un turno asignado
      description: Solo RRHH. Puede modificarse hasta las 23:59 del día anterior al turno; desde el inicio del día queda bloqueado según America/Lima.
      security: [{bearerAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateAssignmentRequest'}
      responses:
        '200': {description: Asignación actualizada, content: {application/json: {schema: {$ref: '#/components/schemas/Assignment'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {description: Asignación no encontrada}
        '409': {description: El trabajador ya tiene otro turno en la nueva fecha}
        '423': {description: El turno ya está bloqueado por fecha}
    delete:
      tags: [Workforce]
      summary: Eliminar un turno asignado
      description: Solo RRHH. Puede eliminarse hasta las 23:59 del día anterior; desde el inicio del día del turno queda bloqueado según America/Lima.
      security: [{bearerAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '204': {description: Asignación eliminada}
        '404': {description: Asignación no encontrada}
        '423': {description: El turno ya está bloqueado por fecha}
  /workers/{id}/shifts/range:
    get:
      tags: [Workforce]
      summary: Consultar turnos de un trabajador entre fechas
      description: Disponible para ADMIN, OWNER y RRHH. Incluye las fechas from y to.
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: from, in: query, required: true, example: '2026-09-01', schema: {type: string, format: date}}
        - {name: to, in: query, required: true, example: '2026-09-30', schema: {type: string, format: date}}
      responses:
        '200': {description: Turnos en el rango, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Assignment'}}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /workers/my/shifts/range:
    get:
      tags: [Workforce]
      summary: Consultar mis turnos entre fechas
      description: Solo WORKER. El trabajador se obtiene del Bearer Token; incluye las fechas from y to.
      security: [{bearerAuth: []}]
      parameters:
        - {name: from, in: query, required: true, example: '2026-09-01', schema: {type: string, format: date}}
        - {name: to, in: query, required: true, example: '2026-09-30', schema: {type: string, format: date}}
      responses:
        '200': {description: Turnos del trabajador autenticado en el rango, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Assignment'}}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /workers/my/status:
    get:
      tags: [Workforce, Meals]
      summary: Consultar mi turno y alimentación actual
      description: Solo WORKER. Obtiene el usuario desde el token y evalúa turno, horario de comida, elegibilidad, reclamo y consumo usando hora de Perú. El turno DAY permanece activo desde el inicio de BREAKFAST hasta el fin de LUNCH; el turno DINNER, desde el inicio de DINNER hasta el fin de BREAKFAST del día siguiente.
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Estado actual, content: {application/json: {schema: {$ref: '#/components/schemas/WorkerCurrentStatus'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /meal-schedules:
    get:
      tags: [Meals]
      summary: Consultar los horarios de comidas
      description: Disponible para cualquier usuario autenticado. Devuelve los horarios activos usando la zona horaria configurada.
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Horarios de comidas, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/MealSchedule'}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /meal-claims/my/preview:
    get:
      tags: [Meals]
      summary: Obtener la comida que puede reclamar el trabajador
      description: Solo WORKER. Usa el usuario del token y no crea registros. Informa turno, comida, horario, disponibilidad y si ya fue reclamada.
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Vista previa del reclamo, content: {application/json: {schema: {$ref: '#/components/schemas/MealClaimPreview'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /meal-claims/my/confirm-print:
    post:
      tags: [Meals]
      summary: Confirmar impresión y registrar el reclamo
      description: Solo WORKER. Crea meal_claims únicamente cuando printed es true. Vuelve a validar horario, turno elegible y que la comida no haya sido reclamada.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MealPrintConfirmation'}
      responses:
        '201': {description: Impresión confirmada y reclamo registrado, content: {application/json: {schema: {$ref: '#/components/schemas/MealPrintConfirmationResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: La comida ya fue reclamada}
  /meal-orders:
    get:
      tags: [Meals]
      summary: Listar pedidos de comida
      description: COLLABORATOR y OWNER. Por defecto devuelve CLAIMED; la lista deja de incluir un pedido al validarse o al cerrar su horario.
      security: [{bearerAuth: []}]
      parameters:
        - {name: status, in: query, required: false, schema: {type: string, enum: [CLAIMED, VALIDATED], default: CLAIMED}}
      responses:
        '200': {description: Pedidos, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/MealOrder'}}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /meal-status-reports:
    get:
      tags: [Meals]
      summary: Reporte paginado de estados de comidas por rango
      description: OWNER y RRHH. Agrupa por tipo de comida los estados reclamados (CLAIMED, CLAIMED_BUT_NOT_VALIDATED y VALIDATED) y no reclamados (CREATED y NOT_CLAIMED), e incluye el detalle por trabajador.
      security: [{bearerAuth: []}]
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date}}
        - {name: to, in: query, required: true, schema: {type: string, format: date}}
        - {name: page, in: query, required: false, schema: {type: integer, minimum: 1, default: 1}}
        - {name: page_size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200': {description: Resumen por comida y detalle paginado con estados exactos}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /meal-status-reports/export.xlsx:
    get:
      tags: [Meals]
      summary: Exportar estados de comidas por rango
      security: [{bearerAuth: []}]
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date}}
        - {name: to, in: query, required: true, schema: {type: string, format: date}}
      responses:
        '200': {description: Archivo Excel con hojas Resumen y Detalle}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /meal-reports/daily:
    get:
      tags: [Meals]
      summary: Reporte paginado de alimentación
      description: OWNER y RRHH. Sin filtros devuelve el día anterior en hora Perú. Distingue consumidos, pedidos sin validar y no reclamados.
      security: [{bearerAuth: []}]
      parameters:
        - {name: from, in: query, required: false, schema: {type: string, format: date}}
        - {name: to, in: query, required: false, schema: {type: string, format: date}}
        - {name: meal_type, in: query, required: false, schema: {type: string, enum: [BREAKFAST, LUNCH, DINNER]}}
        - {name: shift_type, in: query, required: false, schema: {type: string, enum: [DAY, NIGHT]}}
        - {name: page, in: query, required: false, schema: {type: integer, minimum: 1, default: 1}}
        - {name: page_size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200': {description: Reporte paginado, content: {application/json: {schema: {$ref: '#/components/schemas/DetailedMealReport'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /meal-reports/export.xlsx:
    get:
      tags: [Meals]
      summary: Exportar reporte de alimentación a Excel
      description: OWNER y RRHH. Aplica from, to, meal_type y shift_type; sin filtros exporta el día anterior completo.
      security: [{bearerAuth: []}]
      parameters:
        - {name: from, in: query, required: false, schema: {type: string, format: date}}
        - {name: to, in: query, required: false, schema: {type: string, format: date}}
        - {name: meal_type, in: query, required: false, schema: {type: string, enum: [BREAKFAST, LUNCH, DINNER]}}
        - {name: shift_type, in: query, required: false, schema: {type: string, enum: [DAY, NIGHT]}}
      responses:
        '200':
          description: Archivo Excel con hojas Resumen y Detalle
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: {type: string, format: binary}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /meal-orders/{id}:
    get:
      tags: [Meals]
      summary: Buscar un pedido por UUID
      description: COLLABORATOR y OWNER. Si ya se entregó devuelve status VALIDATED y la hora de validación.
      security: [{bearerAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Pedido, content: {application/json: {schema: {$ref: '#/components/schemas/MealOrder'}}}}
        '404': {description: Pedido inexistente}
  /meal-orders/{id}/validate:
    patch:
      tags: [Meals]
      summary: Entregar y validar un pedido
      description: Solo COLLABORATOR. La transición CLAIMED a VALIDATED es atómica. Puede validarse desde el inicio de la comida hasta 30 minutos después del fin de su ventana de reclamo.
      security: [{bearerAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Pedido validado, content: {application/json: {schema: {$ref: '#/components/schemas/MealOrder'}}}}
        '404': {description: Pedido inexistente}
        '409': {description: El pedido ya fue validado por otro colaborador}
  /workforce/shift-preview:
    get:
      tags: [Workforce]
      summary: Ruta compatible para la lista de comidas que se preparan por fecha
      security: [{bearerAuth: []}]
      parameters:
        - {name: date, in: query, required: false, schema: {type: string, format: date}}
        - {name: from, in: query, required: false, description: Inicio inclusivo del rango; debe enviarse junto con to., schema: {type: string, format: date}}
        - {name: to, in: query, required: false, description: Fin inclusivo del rango; debe enviarse junto con from., schema: {type: string, format: date}}
        - {name: page, in: query, required: false, schema: {type: integer, minimum: 1, default: 1}}

        - {name: page_size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}

      responses:
        '200':
          description: Lista paginada de comidas cuya fecha efectiva de servicio coincide con date
  /meal-preparation-preview:
    get:
      tags: [Meals]
      summary: Listar las comidas que deben prepararse en una fecha
      description: Incluye BREAKFAST y LUNCH del turno DAY de la fecha, DINNER del turno nocturno de la fecha y BREAKFAST de los turnos DINNER del día anterior.
      security: [{bearerAuth: []}]
      parameters:
        - {name: date, in: query, required: false, schema: {type: string, format: date}}
        - {name: page, in: query, required: false, schema: {type: integer, minimum: 1, default: 1}}
        - {name: page_size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200': {description: Lista paginada de comidas a preparar}
  /workforce/shift-preview/export.xlsx:
    get:
      tags: [Workforce]
      summary: Exportar Comidas Dia Actual a Excel
      description: Genera un archivo sin paginación con tres hojas (Desayunos, Almuerzos y Cenas); cada hoja muestra fecha, cantidad y todos los trabajadores asignados.
      security: [{bearerAuth: []}]
      parameters:
        - {name: date, in: query, required: false, schema: {type: string, format: date}}
        - {name: from, in: query, required: false, description: Inicio inclusivo; debe enviarse junto con to., schema: {type: string, format: date}}
        - {name: to, in: query, required: false, description: Fin inclusivo; debe enviarse junto con from., schema: {type: string, format: date}}

        - {name: meal_type, in: query, required: false, schema: {type: array, items: {type: string, enum: [BREAKFAST, LUNCH, DINNER]}}}

      responses:
        '200':
          description: Archivo XLSX
  /meal-preparation-preview/export.xlsx:
    get:
      tags: [Meals]
      summary: Exportar Comidas Dia Actual a Excel
      description: Genera un archivo sin paginación con tres hojas (Desayunos, Almuerzos y Cenas); cada hoja muestra fecha, cantidad y todos los trabajadores asignados.
      security: [{bearerAuth: []}]
      parameters:
        - {name: date, in: query, required: false, schema: {type: string, format: date}}
        - {name: meal_type, in: query, required: false, schema: {type: array, items: {type: string, enum: [BREAKFAST, LUNCH, DINNER]}}}
      responses:
        '200':
          description: Archivo XLSX Comidas Dia Actual
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {}
  /ws/meal-orders:
    get:
      tags: [Meals]
      summary: WebSocket de pedidos en vivo
      description: COLLABORATOR y OWNER. En navegador conectar con los subprotocolos ["bearer", "JWT"]. El token no se acepta en la URL. Emite MEAL_ORDER_CREATED y MEAL_ORDER_VALIDATED.
      parameters:
        - {name: access_token, in: query, required: false, schema: {type: string}}
      responses:
        '101': {description: WebSocket conectado}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  responses:
    BadRequest: {description: Datos inválidos, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Unauthorized: {description: Credenciales inválidas, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Forbidden: {description: El rol autenticado no tiene permiso, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  schemas:
    AdminBootstrapRequest:
      type: object
      required: [username, password, first_name, last_name]
      properties:
        username: {type: string}
        email: {type: string, format: email}
        password: {type: string, minLength: 8}
        first_name: {type: string}
        last_name: {type: string}
    ManagementRegisterRequest:
      type: object
      required: [username, password, first_name, last_name, role]
      properties:
        username: {type: string}
        email: {type: string, format: email}
        password: {type: string, minLength: 8}
        first_name: {type: string}
        last_name: {type: string}
        role: {type: string, enum: [OWNER, RRHH]}
    CollaboratorRegisterRequest:
      type: object
      required: [username, password, first_name, last_name]
      properties:
        username: {type: string, example: ayudante1}
        password: {type: string, minLength: 8}
        email: {type: string, format: email}
        first_name: {type: string}
        last_name: {type: string}
    WorkerRegisterRequest:
      type: object
      required: [dni, first_name, last_name, employee_code]
      properties:
        dni: {type: string}
        email: {type: string, format: email}
        first_name: {type: string}
        last_name: {type: string}
        employee_code: {type: string, example: EMP-001}
        job_title: {type: string, example: Operario}
        department: {type: string, example: Producción}
        phone: {type: string}
        address: {type: string}
        hire_date: {type: string, format: date}
        emergency_contact_name: {type: string}
        emergency_contact_phone: {type: string}
        notes: {type: string}
    WorkerRegistrationResponse:
      type: object
      properties:
        user: {$ref: '#/components/schemas/User'}
        worker_information:
          type: object
          properties:
            user_id: {type: string, format: uuid}
            employee_code: {type: string}
            job_title: {type: string}
            department: {type: string}
    AssignmentRequest:
      type: object
      required: [worker_id, shift_type, work_date]
      properties:
        worker_id: {type: string, format: uuid}
        shift_type: {type: string, enum: [DAY, NIGHT]}
        work_date: {type: string, format: date}
        notes: {type: string}
    UpdateAssignmentRequest:
      type: object
      required: [shift_type, work_date]
      properties:
        shift_type: {type: string, enum: [DAY, NIGHT]}
        work_date: {type: string, format: date}
        notes: {type: string}
    MassiveAssignmentRequest:
      type: object
      required: [dates, shift, workers]
      properties:
        dates:
          type: object
          required: [from, to]
          properties:
            from: {type: string, format: date, example: '2026-09-14'}
            to: {type: string, format: date, example: '2026-09-20'}
        shift: {type: string, enum: [DAY, NIGHT]}
        workers:
          type: array
          minItems: 1
          items: {type: string, format: uuid}
    MassiveAssignmentResponse:
      type: object
      required: [created, replaced]
      properties:
        created: {type: integer, example: 105}
        replaced: {type: integer, example: 12}
    WorkerCurrentStatus:
      type: object
      properties:
        peru_time: {type: string, format: date-time}
        on_shift: {type: boolean}
        current_shift:
          type: object
          properties:
            assignment_id: {type: string, format: uuid}
            shift_type: {type: string, enum: [DAY, NIGHT]}
            work_date: {type: string, format: date}
        assigned_meals:
          type: array
          description: Comidas correspondientes al turno actual con su fecha efectiva de servicio.
          items:
            type: object
            properties:
              meal_type: {type: string, enum: [BREAKFAST, LUNCH, DINNER]}
              display_name: {type: string, enum: [Desayuno, Almuerzo, Cena]}
              service_date: {type: string, format: date}
        meal_window_open: {type: boolean}
        current_meal:
          type: object
          properties:
            meal_type: {type: string, enum: [BREAKFAST, LUNCH, DINNER]}
            window_start: {type: string}
            window_end: {type: string}
            eligible: {type: boolean}
            can_claim: {type: boolean}
            already_claimed: {type: boolean}
            claim_id: {type: string, format: uuid}
    Assignment:
      allOf:
        - {$ref: '#/components/schemas/AssignmentRequest'}
        - type: object
          properties:
            id: {type: string, format: uuid}
            assigned_by: {type: string, format: uuid}
            status: {type: string, enum: [OPEN, CLOSED]}
    AssignmentConflict:
      type: object
      properties:
        error:
          type: object
          properties:
            code: {type: string, example: WORKER_ALREADY_ASSIGNED}
            message: {type: string, example: El trabajador ya tiene un turno asignado para esa fecha}
            worker_id: {type: string, format: uuid}
            work_date: {type: string, format: date}
            existing_shift:
              type: object
              properties:
                assignment_id: {type: string, format: uuid}
                shift_type: {type: string, enum: [DAY, NIGHT]}
                notes: {type: string}
    MealClaimPreview:
      type: object
      properties:
        redemptionId: {type: string, format: uuid}
        ticketNumber: {type: string, example: TK-20260830-A1B2C3D4-LUNCH}
        status: {type: string, enum: [AUTHORIZED, DENIED]}
        worker:
          type: object
          properties:
            id: {type: string, format: uuid}
            fullName: {type: string, example: María Pérez Gómez}
            documentNumber: {type: string, example: '****5678'}
        service:
          type: object
          properties:
            type: {type: string, enum: [BREAKFAST, LUNCH, DINNER]}
            name: {type: string, enum: [BREAKFAST, ALMUERZO, CENA]}
        date: {type: string, example: '30/08/2026'}
        time: {type: string, example: '12:15 p.m.'}
        reason: {type: string}
    MealPrintConfirmation:
      type: object
      required: [meal_type, printed]
      properties:
        meal_type: {type: string, enum: [BREAKFAST, LUNCH, DINNER]}
        printed: {type: boolean, example: true}
        notes: {type: string, example: Ticket impreso correctamente}
    MealPrintConfirmationResponse:
      type: object
      properties:
        claim_created: {type: boolean, example: true}
        claim: {$ref: '#/components/schemas/MealClaim'}
    MealSchedule:
      type: object
      properties:
        meal_type: {type: string, enum: [BREAKFAST, LUNCH, DINNER]}
        claim_start: {type: string, example: '06:00:00'}
        claim_end: {type: string, example: '09:00:00'}
        timezone: {type: string, example: America/Lima}
        description: {type: string}
        active: {type: boolean}
    MealClaim:
      type: object
      properties:
        id: {type: string, format: uuid}
        worker_id: {type: string, format: uuid}
        shift_assignment_id: {type: string, format: uuid}
        meal_type: {type: string, enum: [BREAKFAST, LUNCH, DINNER]}
        service_date: {type: string, format: date}
        claimed_at: {type: string, format: date-time}
        status: {type: string, enum: [CREATED, CLAIMED, NOT_CLAIMED, CLAIMED_BUT_NOT_VALIDATED, VALIDATED]}
        validated_at: {type: string, format: date-time}
        validated_by: {type: string, format: uuid}
        notes: {type: string}
    MealOrder:
      allOf:
        - {$ref: '#/components/schemas/MealClaim'}
        - type: object
          properties:
            worker:
              type: object
              properties:
                id: {type: string, format: uuid}
                fullName: {type: string}
                documentNumber: {type: string, example: '****5678'}
            service:
              type: object
              properties:
                type: {type: string, enum: [BREAKFAST, LUNCH, DINNER]}
                name: {type: string, enum: [BREAKFAST, ALMUERZO, CENA]}
    MealReportRow:
      type: object
      properties:
        meal_type: {type: string, enum: [BREAKFAST, LUNCH, DINNER]}
        eligible: {type: integer}
        claimed: {type: integer}
        not_claimed: {type: integer}
    DetailedMealReport:
      type: object
      properties:
        filters:
          type: object
          properties:
            from: {type: string, format: date-time}
            to: {type: string, format: date-time}
            meal_type: {type: string, enum: [BREAKFAST, LUNCH, DINNER]}
            shift_type: {type: string, enum: [DAY, NIGHT]}
        summary:
          type: object
          properties:
            total_eligible: {type: integer}
            consumed: {type: integer, description: Pedidos VALIDATED}
            requested_not_validated: {type: integer, description: Registros CLAIMED_BUT_NOT_VALIDATED}
            not_claimed: {type: integer, description: Registros NOT_CLAIMED}
            did_not_consume: {type: integer, description: CLAIMED_BUT_NOT_VALIDATED más NOT_CLAIMED}
        data:
          type: array
          items: {$ref: '#/components/schemas/DetailedMealReportRow'}
        page: {type: integer}
        page_size: {type: integer}
        total: {type: integer}
        total_pages: {type: integer}
    DetailedMealReportRow:
      type: object
      properties:
        id: {type: string, format: uuid}
        service_date: {type: string, format: date-time}
        meal_type: {type: string, enum: [BREAKFAST, LUNCH, DINNER]}
        shift_type: {type: string, enum: [DAY, NIGHT]}
        status: {type: string, enum: [CREATED, CLAIMED, NOT_CLAIMED, CLAIMED_BUT_NOT_VALIDATED, VALIDATED]}
        claimed_at: {type: string, format: date-time}
        validated_at: {type: string, format: date-time}
        worker_id: {type: string, format: uuid}
        full_name: {type: string}
        document_number: {type: string, example: '****5678'}
        employee_code: {type: string}
        department: {type: string}
    PasswordLogin:
      type: object
      required: [username, password]
      properties: {username: {type: string}, password: {type: string}}
    DNILogin:
      type: object
      required: [dni]
      properties: {dni: {type: string}}
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties: {refresh_token: {type: string}}
    TokenPair:
      type: object
      properties:
        access_token: {type: string}
        refresh_token: {type: string}
        token_type: {type: string, example: Bearer}
        expires_in: {type: integer, example: 300}
    WorkerAccessToken:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token: {type: string}
        token_type: {type: string, example: Bearer}
        expires_in: {type: integer, example: 45}
    User:
      type: object
      properties:
        id: {type: string, format: uuid}
        role: {type: string, enum: [ADMIN, OWNER, RRHH, WORKER, COLLABORATOR]}
        active: {type: boolean}
    MyUser:
      allOf:
        - {$ref: '#/components/schemas/User'}
        - type: object
          properties:
            profile:
              type: object
              properties:
                first_name: {type: string}
                last_name: {type: string}
                email: {type: string, format: email}
            credentials:
              type: array
              items:
                type: object
                properties:
                  type: {type: string, enum: [PASSWORD, DNI, FACE_SCAN]}
                  identifier: {type: string}
            worker_information:
              type: object
              properties:
                employee_code: {type: string}
                job_title: {type: string}
                department: {type: string}
    Error:
      type: object
      properties: {error: {type: string}}
